<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Registro de Ocorrências Escolares</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family: Arial;
background:#f4f6f8;
margin:0;
}

header{
background:#2c3e50;
color:white;
text-align:center;
padding:20px;
}

section{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, select, textarea{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;
}

button:hover{
background:#2ecc71;
}

#qrcode{
margin-top:20px;
text-align:center;
}

</style>

</head>

<body>

<header>
<h1>Registro de Ocorrências</h1>
<p>Controle de uso indevido de celular e fones</p>
</header>

<section>

<h2>Cadastro de Ocorrência</h2>

<input type="text" id="nome" placeholder="Nome do aluno">
<input type="text" id="turma" placeholder="Turma">

<select id="ocorrencia">
<option>Uso de celular em sala</option>
<option>Uso de fone de ouvido</option>
<option>Uso indevido de tecnologia</option>
</select>

<textarea id="descricao" placeholder="Descrição da ocorrência"></textarea>

<button onclick="gerarRegistro()">Gerar Registro</button>
<button onclick="enviarWhats()">Enviar WhatsApp</button>
<button onclick="enviarEmail()">Enviar Email</button>

<div id="saida"></div>

<div id="qrcode"></div>

</section>

<script>

let textoFinal = ""

function gerarRegistro(){

let nome = document.getElementById("nome").value
let turma = document.getElementById("turma").value
let ocorrencia = document.getElementById("ocorrencia").value
let descricao = document.getElementById("descricao").value

textoFinal = `Aluno: ${nome}
Turma: ${turma}
Ocorrência: ${ocorrencia}
Descrição: ${descricao}`

document.getElementById("saida").innerHTML = "<pre>"+textoFinal+"</pre>"

// QR Code
document.getElementById("qrcode").innerHTML = ""
new QRCode(document.getElementById("qrcode"), textoFinal)

}

// WhatsApp
function enviarWhats(){

let numero = "55SEUNUMEROAQUI"
let url = `https://wa.me/${numero}?text=${encodeURIComponent(textoFinal)}`
window.open(url)

}

// Email
function enviarEmail(){

let email = "seuemail@email.com"
let assunto = "Ocorrência Escolar"
let body = encodeURIComponent(textoFinal)

window.location.href = `mailto:${email}?subject=${assunto}&body=${body}`

}

</script>

</body>
</html>
